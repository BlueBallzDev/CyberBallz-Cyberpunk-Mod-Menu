# youtube-autopilot configuration

channel:
  # Describe the channel so the model writes on-brand scripts.
  niche: "futurism and emerging technology explained simply"
  audience: "curious adults with no technical background"
  tone: "confident, conversational, a little wry — never robotic or hypey"
  language: "English"

video:
  aspect: landscape        # landscape (16:9 long-form) or short (9:16 vertical)
  target_minutes: 4        # shorts should be <= 0.9
  voice: en-US-GuyNeural   # any edge-tts voice; list with: edge-tts --list-voices
  voice_rate: "+0%"        # e.g. "+10%" to speak faster
  captions: true           # burn subtitles into the video
  music: null              # optional path to a background music file you have rights to

upload:
  privacy: public          # public | unlisted | private
  category_id: "28"        # 27 = Education, 28 = Science & Technology
  notify_subscribers: true
  # RFC3339 timestamp to schedule instead of publishing immediately (privacy
  # must be "private" for scheduling to apply). Leave null to publish on upload.
  publish_at: null
  # YouTube requires disclosure when realistic content is synthetic/AI-altered.
  # This appends a disclosure line to every description.
  ai_disclosure: true

api:
  model: claude-opus-4-8
  # Web-search research before every video: verifies facts for queued topics,
  # and when the queue is empty, picks the currently-trending topic in the
  # niche instead of inventing one blind.
  research: true
  # Critique-and-revise loop: a strict editorial pass scores each script 1-10
  # and rewrites it until it clears min_quality (or max_revisions is hit).
  quality_gate: true
  min_quality: 8
  max_revisions: 2
  # Offline fallback for topic ideas when research is disabled.
  auto_topics: true
