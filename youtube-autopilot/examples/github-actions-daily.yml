# Fully automated daily upload via GitHub Actions.
#
# To activate:
#   1. Copy this file to .github/workflows/youtube-daily.yml
#   2. Add repository secrets (Settings -> Secrets and variables -> Actions):
#        ANTHROPIC_API_KEY   - your Anthropic key
#        PEXELS_API_KEY      - your Pexels key (optional)
#        YT_CLIENT_SECRET    - full contents of client_secret.json
#        YT_TOKEN            - full contents of state/token.json
#                              (created locally with: python run.py auth)
#   3. Adjust the cron schedule below (times are UTC).
#
# The workflow commits state/published.json back so topics aren't repeated.

name: Daily YouTube upload

on:
  schedule:
    - cron: "0 15 * * *"   # every day at 15:00 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  produce-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r youtube-autopilot/requirements.txt

      - name: Restore YouTube credentials
        working-directory: youtube-autopilot
        run: |
          mkdir -p state
          printf '%s' "$YT_CLIENT_SECRET" > client_secret.json
          printf '%s' "$YT_TOKEN" > state/token.json
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}

      - name: Produce and upload
        working-directory: youtube-autopilot
        run: python run.py run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Persist published log
        run: |
          git config user.name "youtube-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add youtube-autopilot/state/published.json
          git diff --cached --quiet || git commit -m "Record published video"
          git push
